<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Elo Social</title>
    <link rel="icon" href="/static/img/logo-elosocial.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="tela-acesso">
        <div class="caixa-acesso">
            <img class="logo" src="/static/img/logo-elosocial.png" alt="Elo Social">
            <h1>Bem-vindo de volta</h1>
            <p class="sub">Entre com seu e-mail e senha para acessar o sistema</p>

            <div id="alerta" class="alerta"></div>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••" autocomplete="current-password" required>
                    <div class="esqueci">
                        <a href="#" id="link-esqueci">Esqueci a senha</a>
                        <span class="balao" id="balao-esqueci" role="status">Função não disponível no momento.</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
            </form>

            <p class="rodape">Ainda não tem acesso? <a href="/cadastro">Cadastre-se</a></p>
        </div>
    </main>
    <script src="/static/js/comum.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
