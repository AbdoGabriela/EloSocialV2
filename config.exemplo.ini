; =============================================================
; Elo Social - Configuração (EXEMPLO)
; Copie este arquivo, renomeie a cópia para config.ini
; e preencha com os dados do seu ambiente.
; O config.ini não vai para o GitHub (está no .gitignore).
; =============================================================

[mysql]
; IP da máquina do banco de dados. Se o banco estiver no mesmo
; computador da aplicação, use localhost.
host = IP_DO_SERVIDOR_MYSQL
port = 3306
user = USUARIO_DO_BANCO
password = SUA_SENHA_AQUI
; No Linux o nome do banco diferencia maiúsculas de minúsculas.
database = 02_EloSocial

[app]
; 0.0.0.0 = aceita acessos vindos da rede (não só do próprio computador)
host = 0.0.0.0
port = 5000
; Troque por qualquer texto longo e aleatório (protege o login)
secret_key = TROQUE_POR_UM_TEXTO_LONGO_E_ALEATORIO
